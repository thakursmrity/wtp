<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox: Why That Product</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F2EFFB">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </svg>

  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="/index.html"><img class="brand-mark" src="/assets/logo-mark.svg" alt="" width="40" height="40">Why That Product</a>
      <p class="hand" style="margin:0;">Your inbox</p>
    </div>
  </header>

  <main class="wrap admin-wrap" id="main">
    <section id="login-view" hidden>
      <form class="form sketch login" id="login-form">
        <h1 style="font-size: 2.4rem; margin-bottom: 8px;">Sign in</h1>
        <p class="intro">This page is only for Smrity.</p>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-gold" type="submit">Sign in</button>
        <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="inbox-view" hidden>
      <div class="bar">
        <div class="tabs" role="group" aria-label="Show messages">
          <button type="button" data-tab="new" aria-pressed="true">New <span id="count-new">0</span></button>
          <button type="button" data-tab="open" aria-pressed="false">All open <span id="count-open">0</span></button>
          <button type="button" data-tab="archived" aria-pressed="false">Archived <span id="count-archived">0</span></button>
        </div>
        <div class="tools">
          <label class="sr" for="kind-filter" style="position:absolute;left:-9999px;">Filter by type</label>
          <select id="kind-filter">
            <option value="all">Every type</option>
            <option value="product">Products to break down</option>
            <option value="discovery">Discovery chats</option>
            <option value="question">Interview questions</option>
            <option value="other">Something else</option>
          </select>
          <button class="small" type="button" id="refresh">Refresh</button>
          <button class="small" type="button" id="signout">Sign out</button>
        </div>
      </div>
      <p class="admin-status" id="admin-status" role="status" aria-live="polite"></p>
      <div id="list"></div>
    </section>
  </main>

  <script src="/assets/admin.js"></script>
</body>
</html>
